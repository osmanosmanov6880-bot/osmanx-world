name: OSMANX Cinema media QA

on:
  pull_request:
    paths:
      - "assets/stories/**"
      - "tests/cinema-media.test.mjs"
      - "tests/stories-gallery.test.mjs"
      - "tests/cinema-r2.test.mjs"
      - "tests/cinema-r3.test.mjs"
      - "tests/cinema-r4.test.mjs"
      - "tests/cinema-r5.test.mjs"
      - "tests/cinema_r5_browser.py"
      - "tests/cinema_r3_browser.py"
      - "tests/cinema_r4_browser.py"
      - "tests/cinema_r2_browser.py"
      - "assets/industry/index.html"
      - "assets/catalog/index.html"
      - "assets/guest/offer.html"
      - "robots.txt"
      - "sitemap.xml"
      - "index.html"
      - "assets/catalog/index.html"
      - "assets/guest/offer.html"
      - ".github/workflows/cinema-ci.yml"
      - ".github/workflows/deploy.yml"
  push:
    branches:
      - feature/osmanx-video-stories-20261119
      - main
    paths:
      - "assets/stories/**"
      - "tests/cinema-media.test.mjs"
      - "tests/stories-gallery.test.mjs"
      - ".github/workflows/cinema-ci.yml"
      - ".github/workflows/deploy.yml"
      - "tests/cinema-r2.test.mjs"
      - "tests/cinema-r4.test.mjs"
      - "tests/cinema-r5.test.mjs"
      - "tests/cinema_r4_browser.py"
      - "tests/cinema_r5_browser.py"
      - "tests/cinema_r2_browser.py"
      - "robots.txt"
      - "sitemap.xml"

permissions:
  contents: read

jobs:
  cinema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout project and media
        uses: actions/checkout@v4
      - name: Check scripts
        run: |
          node --check assets/stories/cinema.js
          node --check assets/stories/cinema-r2.js
          node --check assets/stories/cinema-r3.js
          node --check assets/stories/manager.js
          node --check assets/stories/story-engine.js
          node --check assets/sovereign/site.js
      - name: Confirm all media, page links and SHA-256
        run: node --test tests/stories-gallery.test.mjs tests/cinema-media.test.mjs tests/cinema-r2.test.mjs tests/cinema-r3.test.mjs tests/cinema-r4.test.mjs tests/cinema-r5.test.mjs
      - name: Check playable MP4 containers
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          command -v ffprobe
          for file in assets/stories/media/*.mp4; do
            ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 "$file" > /dev/null
            video_codec="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 "$file")"
            test "$video_codec" = "h264"
          done
          film_audio="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 assets/stories/media/00-osmanx-film.mp4)"
          test "$film_audio" = "aac"
      - name: Verify no short-lived Runway links in public site
        run: |
          set -euo pipefail
          ! grep -R -E '(_jwt=|dnznrvs05pmza\.cloudfront\.net)' assets/stories --include='*.html' --include='*.js' --include='*.css'

  browser-r2:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser driver and verify preinstalled Chrome
        run: |
          python -m pip install playwright==1.56.0
          command -v google-chrome || command -v chromium
          (google-chrome --version || chromium --version)
      - name: Run mobile and desktop cinematic conversion tests
        run: |
          python tests/cinema_r2_browser.py
          python tests/cinema_r3_browser.py
          python tests/cinema_r4_browser.py
          python tests/cinema_r5_browser.py
      - name: Upload cinematic browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osmanx-cinema-r2-browser
          path: |
            qa/cinema-r2/*.png
            qa/cinema-r3/*.png
          if-no-files-found: ignore
