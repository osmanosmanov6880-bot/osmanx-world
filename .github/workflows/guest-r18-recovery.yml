name: OSMANX Guest R18 external custody and recovery acceptance
on:
  pull_request:
    branches: [main, feat/guest-r17-witness-fence-onboarding-20261119]
    paths:
      - "services/industry-api/**"
      - "assets/guest/console.js"
      - "tests/guest-console-r18.test.mjs"
      - ".github/workflows/guest-r18-recovery.yml"
  push:
    branches: [main]
    paths: ["services/industry-api/**", ".github/workflows/guest-r18-recovery.yml"]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  r18-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: services/industry-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax, no secrets and fail-closed integration
        run: |
          set -euo pipefail
          for f in src/guest-r18-anchor.mjs src/guest-r18-fence.mjs \
            src/guest-r18-proof.mjs scripts/r18-anchor-signer.mjs \
            scripts/r18-proof.mjs scripts/r18-dr-rehearsal.mjs \
            scripts/r18-release-gate.mjs test/r18-synthetic-fixture.mjs \
            test/guest-r18.test.mjs test/guest-r18-http.test.mjs; do
            node --check "$f"
          done
          node --check ../../assets/guest/console.js
          test -s ../../docs/GUEST_INTELLIGENCE_R18.md
          grep -Fq 'await assertR18Fence(db,externalAnchor)' src/app.mjs
          grep -Fq 'FORCE ROW LEVEL SECURITY' migrations/013_guest_external_anchor_fence.sql
          grep -Fq 'GUEST_WRITES_ENABLED: "false"' ops/compose.r14.yml
          if find . -type f \( -name '*.pem' -o -name '*.key' -o -name 'identity.txt' \) -print -quit | grep -q .; then
            echo "::error::Private signing material inside source"
            exit 1
          fi
      - name: Install pinned runtime packages
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Offline custody, tampering, archive and DR recovery regression
        run: node --test test/guest-r18.test.mjs
      - name: R17 backward compatible cryptographic gate
        run: node --test test/guest-r17.test.mjs
      - name: R17-R18 Russian UI and read-only status tests
        run: node --test ../../tests/guest-console-r17.test.mjs ../../tests/guest-console-r18.test.mjs
      - name: Inspect actual R14-R17 GitHub PRs read-only (NOT production authorization)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/r18-release-gate.mjs --github > "$RUNNER_TEMP/r18-release-review.json"
          node --input-type=module -e "import fs from 'node:fs'; const a=JSON.parse(fs.readFileSync(process.argv[1])); if(a.productionActivated!==false||a.customerGo!==false||a.changesMade!==false)process.exit(1); console.log('R18 release report generated; no action authorized')" "$RUNNER_TEMP/r18-release-review.json"

  r18-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: industry_ci}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d industry_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      NODE_ENV: test
      ALLOWED_ORIGIN: http://localhost
      MIGRATION_DB_URL: postgres://postgres:postgres@127.0.0.1:5432/industry_ci
      DATABASE_URL: postgres://industry_app:industrypass@127.0.0.1:5432/industry_ci
      WORKER_DB_URL: postgres://industry_worker:workerpass@127.0.0.1:5432/industry_ci
    defaults:
      run:
        working-directory: services/industry-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Node syntax and install runtime
        run: |
          set -euo pipefail
          for f in src/*.mjs scripts/*.mjs test/*.mjs; do node --check "$f"; done
          npm install --ignore-scripts --no-audit --no-fund
      - name: Least-privilege synthetic PostgreSQL roles
        run: |
          PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d industry_ci -c "CREATE ROLE industry_app LOGIN PASSWORD 'industrypass' NOBYPASSRLS;"
          PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d industry_ci -c "CREATE ROLE industry_worker LOGIN PASSWORD 'workerpass' BYPASSRLS;"
      - name: Run migrations through 013 twice; no history rewrite
        run: |
          npm run migrate
          npm run migrate
      - name: All real Fastify PostgreSQL R7-R18 regressions
        run: npm test

  r18-encrypted-dr:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: industry_ci}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d industry_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      MIGRATION_DB_URL: postgres://postgres:postgres@127.0.0.1:5432/industry_ci
      BACKUP_DB_URL: postgres://postgres:postgres@127.0.0.1:5432/industry_ci
    defaults:
      run:
        working-directory: services/industry-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PostgreSQL client, AGE and migration dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client age
          npm install --ignore-scripts --no-audit --no-fund
      - name: Provision isolated roles and migrate
        run: |
          PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d industry_ci -c "CREATE ROLE industry_app LOGIN PASSWORD 'industrypass' NOBYPASSRLS;"
          PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d industry_ci -c "CREATE ROLE industry_worker LOGIN PASSWORD 'workerpass' BYPASSRLS;"
          npm run migrate
      - name: Seed synthetic checkpoints and one non-PII external receipt
        run: |
          set -euo pipefail
          export PGPASSWORD=postgres
          psql -h 127.0.0.1 -U postgres -d industry_ci -v ON_ERROR_STOP=1 <<'SQL'
          UPDATE industry.guest_registry_checkpoint_fence
            SET max_revision=1,max_sequence=3,checkpoint_sha=repeat('a',64)
            WHERE id=1;
          UPDATE industry.guest_external_anchor_fence
            SET max_revision=1,max_sequence=3,checkpoint_sha=repeat('a',64),
                anchor_sha=repeat('b',64)
            WHERE id=1;
          INSERT INTO industry.guest_external_anchor_receipts
            (journal_sequence,registry_revision,checkpoint_sha,anchor_sha)
            VALUES(3,1,repeat('a',64),repeat('b',64));
          SQL
      - name: Encrypt schema backup for TWO unrelated AGE recipients
        run: |
          set -euo pipefail
          age-keygen -o "$RUNNER_TEMP/r18-first.key"
          age-keygen -o "$RUNNER_TEMP/r18-second.key"
          pub1="$(grep '^# public key:' "$RUNNER_TEMP/r18-first.key" | awk '{print $4}')"
          pub2="$(grep '^# public key:' "$RUNNER_TEMP/r18-second.key" | awk '{print $4}')"
          test -n "$pub1" && test -n "$pub2" && test "$pub1" != "$pub2"
          AGE_RECIPIENT_1="$pub1" AGE_RECIPIENT_2="$pub2" sh ops/backup-encrypted.sh "$RUNNER_TEMP/r18-backups"
          test "$(find "$RUNNER_TEMP/r18-backups" -name '*.age' | wc -l)" -eq 1
      - name: Restore twice to different industry_dr databases; compare receipts
        run: |
          set -euo pipefail
          archive="$(find "$RUNNER_TEMP/r18-backups" -name '*.age' -print -quit)"
          export PGPASSWORD=postgres
          for target in first second; do
            createdb -h 127.0.0.1 -U postgres "industry_dr_r18_$target"
            key="$RUNNER_TEMP/r18-first.key"
            if [ "$target" = second ]; then key="$RUNNER_TEMP/r18-second.key"; fi
            DR_RESTORE_DB_URL="postgresql://postgres:postgres@127.0.0.1:5432/industry_dr_r18_$target" AGE_IDENTITY_FILE="$key" sh ops/restore-dr.sh "$archive"
            row="$(psql -h 127.0.0.1 -U postgres -d "industry_dr_r18_$target" -Atc "SELECT (SELECT max_sequence FROM industry.guest_registry_checkpoint_fence WHERE id=1)::text || ':' || (SELECT max_sequence FROM industry.guest_external_anchor_fence WHERE id=1)::text || ':' || (SELECT count(*) FROM industry.guest_external_anchor_receipts)::text")"
            test "$row" = '3:3:1'
          done
      - name: Reject production restore and corrupted ciphertext
        run: |
          set -euo pipefail
          archive="$(find "$RUNNER_TEMP/r18-backups" -name '*.age' -print -quit)"
          if DR_RESTORE_DB_URL="postgresql://postgres:postgres@127.0.0.1:5432/industry_ci" AGE_IDENTITY_FILE="$RUNNER_TEMP/r18-first.key" sh ops/restore-dr.sh "$archive"; then
            echo "::error::Production restore was allowed";exit 1
          fi
          mkdir -p "$RUNNER_TEMP/tampered"
          cp "$archive" "$archive.sha256" "$RUNNER_TEMP/tampered/"
          printf 'tamper' >> "$RUNNER_TEMP/tampered/$(basename "$archive")"
          if DR_RESTORE_DB_URL="postgresql://postgres:postgres@127.0.0.1:5432/industry_dr_r18_first" AGE_IDENTITY_FILE="$RUNNER_TEMP/r18-first.key" sh ops/restore-dr.sh "$RUNNER_TEMP/tampered/$(basename "$archive")"; then
            echo "::error::Corrupted archive accepted";exit 1
          fi

  r18-reproducible:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: services/industry-api
    steps:
      - uses: actions/checkout@v4
      - name: Deterministic, verified, secret-free R18 source archive
        run: |
          set -euo pipefail
          bash ops/build-release.sh "$RUNNER_TEMP/r18-a"
          bash ops/build-release.sh "$RUNNER_TEMP/r18-b"
          archive="$(find "$RUNNER_TEMP/r18-a" -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -f "$archive"
          bash ops/verify-release.sh "$archive"
          cmp "$archive" "$RUNNER_TEMP/r18-b/$(basename "$archive")"
          tar -tzf "$archive" > "$RUNNER_TEMP/r18-list.txt"
          for f in src/guest-r18-anchor.mjs src/guest-r18-fence.mjs \
            src/guest-r18-proof.mjs scripts/r18-anchor-signer.mjs scripts/r18-proof.mjs \
            scripts/r18-dr-rehearsal.mjs scripts/r18-release-gate.mjs \
            migrations/013_guest_external_anchor_fence.sql; do
            grep -Fxq "industry-api/$f" "$RUNNER_TEMP/r18-list.txt"
          done
          echo "R18 source verified; NO production deployment."
