name: OSGARD SUPREME DIRECTOR M201 Alerts and Team Tasks
on:
  push:
    branches: [ "recovery/supreme-director-m187-20261104" ]
    paths:
      - "supreme-director/m201/**"
      - "supreme-director/docs/PROGRESS_JOURNAL_RU.md"
      - "supreme-director/README.md"
      - "supreme-director/docs/PROGRESS_JOURNAL_RU.md"
      - "supreme-director/README.md"
      - ".github/workflows/supreme-director-m201.yml"
  pull_request:
    paths:
      - "supreme-director/m201/**"
      - ".github/workflows/supreme-director-m201.yml"
permissions:
  contents: read
jobs:
  alerts-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.11', '3.13' ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Configure local M192-M201 package paths
        run: |
          echo "PYTHONPATH=$GITHUB_WORKSPACE/supreme-director/m192:$GITHUB_WORKSPACE/supreme-director/m193:$GITHUB_WORKSPACE/supreme-director/m194:$GITHUB_WORKSPACE/supreme-director/m195:$GITHUB_WORKSPACE/supreme-director/m196:$GITHUB_WORKSPACE/supreme-director/m197:$GITHUB_WORKSPACE/supreme-director/m198:$GITHUB_WORKSPACE/supreme-director/m199:$GITHUB_WORKSPACE/supreme-director/m200:$GITHUB_WORKSPACE/supreme-director/m201" >> "$GITHUB_ENV"
      - name: Compile new Python and validate Russian UI JavaScript
        run: |
          python3 -m compileall -q supreme-director/m201
          node --check supreme-director/m201/osgard_m201/web/app.js
      - name: M201 policy, alert lifecycle, API and assignment tests
        run: python3 -m unittest discover -s supreme-director/m201/tests -p 'test_*.py' -v
      - name: Regression M192-M200
        run: |
          for v in 192 193 194 195 196 197 198 199 200; do
            echo "=== Checking M$v ==="
            python3 -m unittest discover -s "supreme-director/m$v/tests" -p 'test_*.py' -v
          done
      - name: Synthetic integrated policy → incident → task → clear smoke
        run: python3 supreme-director/m201/smoke.py
