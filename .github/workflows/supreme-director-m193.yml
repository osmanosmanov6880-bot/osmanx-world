name: OSGARD SUPREME DIRECTOR M193 CRM validation
on:
  push:
    branches:
      - recovery/supreme-director-m187-20261104
    paths:
      - supreme-director/m193/**
      - supreme-director/m192/**
      - .github/workflows/supreme-director-m193.yml
  pull_request:
    paths:
      - supreme-director/m193/**
      - supreme-director/m192/**
      - .github/workflows/supreme-director-m193.yml
permissions:
  contents: read
jobs:
  crm-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    env:
      PYTHONPATH: supreme-director/m192:supreme-director/m193
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify M193 source hashes and Russian locale
        run: |
          python3 supreme-director/m193/verify_source.py
          python3 supreme-director/m193/check_locale.py
      - name: Run M193 CRM, security and HTTP integration tests
        run: python3 -m unittest discover -s supreme-director/m193/tests -p 'test_*.py' -v
      - name: Run M192 regression suite
        run: python3 -m unittest discover -s supreme-director/m192/tests -p 'test_*.py' -v
      - name: Validate JavaScript and web assets
        run: |
          node --check supreme-director/m193/osgard_m193/web/app.js
          test -s supreme-director/m193/osgard_m193/web/index.html
          test -s supreme-director/m193/osgard_m193/web/styles.css
          test -s supreme-director/m193/osgard_m193/web/ru.json
