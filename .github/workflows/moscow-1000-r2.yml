name: OSMANX MOSCOW 1000 R2 QA
on:
  pull_request:
    paths:
      - 'moscow-1000/**'
      - 'services/moscow-1000-api/**'
      - 'editorial/moscow-1000/**'
      - 'tests/moscow-1000-*.mjs'
      - '.github/workflows/moscow-1000-r2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS syntax
        run: |
          set -euo pipefail
          for f in moscow-1000/{app,content,geo,publication,map,public-r2,intake}.js services/moscow-1000-api/index.mjs editorial/moscow-1000/validate-publication.mjs; do node --check "$f"; done
      - name: Run R1 regression, R2 map/editorial and Worker API tests
        run: node --test tests/moscow-1000-r1.test.mjs tests/moscow-1000-r2.test.mjs tests/moscow-1000-api.test.mjs
      - name: Verify public publication remains explicitly unpublished before launch
        run: |
          set -euo pipefail
          grep -Fq "status:'unpublished'" moscow-1000/publication.js
          test ! -e moscow-1000/worker
          test ! -e moscow-1000/editorial
          test -s services/moscow-1000-api/migrations/0001_init.sql
          test -s services/moscow-1000-api/wrangler.toml.example
