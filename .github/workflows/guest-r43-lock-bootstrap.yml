name: R43 source lock candidate import (temporary read-only)
on:
  pull_request:
    branches: [feat/guest-r42-merge-proof-backup-custody-dependency-audit-20261120]
    paths:
      - .github/workflows/guest-r43-lock-bootstrap.yml
permissions:
  contents: read
  actions: read
jobs:
  pinned-lock-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: guest-r42-uncommitted-npm-lock-candidate
          run-id: 44705058106
          repository: osmanosmanov6880-bot/osmanx-world
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/r43-original-lock
      - name: Verify exact R42 lock bytes and emit for authenticated source commit
        run: |
          set -euo pipefail
          lock="$RUNNER_TEMP/r43-original-lock/package-lock.json"
          test -s "$lock"
          printf '%s  %s\n' 'd0453f56f370d9d5822ccb2116148e56f07acaccff66deb01d5fc280cbc4321a' "$lock" | sha256sum --check --status
          node -e 'const fs=require("node:fs");const p=fs.readFileSync(process.argv[1],"utf8");const j=JSON.parse(p);if(j.lockfileVersion!==3||Object.keys(j.packages).length!==64)process.exit(1);console.log("R43_LOCK_PAYLOAD="+JSON.stringify(p))' "$lock"
