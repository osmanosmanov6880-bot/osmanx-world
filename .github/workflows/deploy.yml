name: Deploy osmanx.world
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osmanx-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Sovereign Edition assets
        run: |
          set -euo pipefail
          test -s index.html
          test -s assets/sovereign/workspace.html
          node --check assets/sovereign/site.js
          node --check assets/sovereign/workspace.js
          test -s assets/sovereign/site.css
          test -s assets/sovereign/workspace.css
          test -s assets/sovereign/hero.webp
          test -s assets/labs/index.html
          test -s assets/labs/zion-9/index.html
          test -s assets/labs/breakthrough/index.html
          test -s assets/labs/internet-v-humanity/index.html
          node --check assets/labs/breakthrough/app.js
          node --check assets/labs/breakthrough/scene.js

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/osmanx_deploy
          chmod 600 ~/.ssh/osmanx_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Validate target and sync static site
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test "$DEPLOY_USER" = "deploy-osmanx"
          ssh -i ~/.ssh/osmanx_deploy -o IdentitiesOnly=yes -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" 'test -d /var/www/osmanx.world && test -w /var/www/osmanx.world'
          rsync -az --delete --chmod=D2755,F0644             -e "ssh -i ~/.ssh/osmanx_deploy -o IdentitiesOnly=yes -o BatchMode=yes"             --exclude='/assets/downloads/***' --include='/index.html' --include='/assets/***' --exclude='*'             ./ "$DEPLOY_USER@$DEPLOY_HOST:/var/www/osmanx.world/"
          ssh -i ~/.ssh/osmanx_deploy -o IdentitiesOnly=yes -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" 'test -s /var/www/osmanx.world/index.html'

      - name: Verify deployed file integrity on VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          expected="$(sha256sum index.html | cut -d ' ' -f1)"
          actual="$(ssh -i ~/.ssh/osmanx_deploy -o IdentitiesOnly=yes -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" 'sha256sum /var/www/osmanx.world/index.html' | cut -d ' ' -f1)"
          test "$expected" = "$actual"
          echo "VPS index.html SHA-256 matches the checked-out commit." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify public HTTPS content
        env:
          EXPECTED_MARKER: "osmanx-sovereign-live-v1"
        run: |
          set -euo pipefail
          response="$(curl -fLsS --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 8 --max-time 35 -H 'Cache-Control: no-cache' "https://osmanx.world/?__deploy_verify=${GITHUB_SHA}")"
          if [[ "$response" != *"$EXPECTED_MARKER"* ]]; then
            echo "::error::Public HTTPS did not return the new deployment marker"
            exit 1
          fi
          echo "Public HTTPS served the expected deployment marker." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify live OSMANX workspaces over HTTPS
        run: |
          set -euo pipefail
          for asset in /assets/sovereign/site.css /assets/sovereign/site.js /assets/sovereign/workspace.html /assets/sovereign/workspace.css /assets/sovereign/workspace.js /assets/sovereign/hero.webp; do
            curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 8 --max-time 35 -o /dev/null "https://osmanx.world${asset}?release=${GITHUB_SHA}"
          done
          curl -fsSL --retry 3 --connect-timeout 8 --max-time 35 "https://osmanx.world/assets/sovereign/workspace.html?app=retail&release=${GITHUB_SHA}" | grep -Fq 'OSMANX — Рабочее пространство'
          echo "Sovereign workspaces and static assets served over public HTTPS." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify OSMANX Labs live public assets
        run: |
          set -euo pipefail
          base="https://osmanx.world/assets/labs"
          for rel in index.html zion-9/index.html breakthrough/index.html breakthrough/styles.css breakthrough/app.js breakthrough/scene.js internet-v-humanity/index.html; do
            curl -fLsS --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 8 --max-time 35 -o /dev/null "$base/$rel?release=${GITHUB_SHA}"
          done
          for n in $(seq 20 29); do
            curl -fLsS --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 8 --max-time 35 -o /dev/null "$base/zion-9/queue/ZION-0$n/index.html?release=${GITHUB_SHA}"
          done
          curl -fLsS --connect-timeout 8 --max-time 35 "$base/index.html?release=${GITHUB_SHA}" -o /tmp/osmanx-labs.html
          grep -Fq 'osmanx-labs-live-v1' /tmp/osmanx-labs.html
          curl -fLsS --connect-timeout 8 --max-time 35 "$base/zion-9/index.html?release=${GITHUB_SHA}" -o /tmp/osmanx-zion.html
          grep -Fq 'osmanx-zion-labs-v1' /tmp/osmanx-zion.html
          echo 'Public Labs + 12 independent prototype entrypoints verified over HTTPS' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary key
        if: always()
        run: rm -f ~/.ssh/osmanx_deploy ~/.ssh/known_hosts
