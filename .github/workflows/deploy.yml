name: Deploy osmanx.world
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "robots.txt"
      - "sitemap.xml"
      - "assets/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osmanx-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Sovereign Edition assets
        run: |
          set -euo pipefail
          test -s index.html
          test -s assets/guest/offer.html
          test -s assets/guest/experiment.html
          test -s assets/guest/pilot.html
          test -s assets/guest/console.html
          test -s assets/guest/join.html
          test -s assets/guest/join.js
          test -s assets/guest/console.js
          test -s assets/guest/pilot.js
          test -s assets/guest/pilot-model.js
          test -s assets/guest/experiment-model.js
          test -s assets/guest/experiment.js
          node --check assets/guest/experiment-model.js
          node --check assets/guest/experiment.js
          node --check assets/guest/pilot.js
          node --check assets/guest/console.js
          node --check assets/guest/join.js
          node --check assets/guest/pilot-model.js
          node --test tests/guest-experiment.test.mjs tests/guest-pilot-r3.test.mjs tests/guest-console-r4.test.mjs tests/guest-console-r5.test.mjs tests/guest-console-r8.test.mjs tests/guest-console-r9.test.mjs tests/guest-console-r11.test.mjs tests/guest-console-r12.test.mjs tests/guest-console-r13.test.mjs
          test -s assets/sovereign/workspace.html
          test -s assets/industry/index.html
          test -s assets/industry/style.css
          node --check assets/industry/app.js
          node --check assets/industry/operations.js
          node --check assets/industry/booking.js
          test -s assets/industry/booking.html
          test -s assets/industry/booking.css
          test -s assets/industry/operations.css
          node --check assets/industry/console.js
          test -s assets/industry/console.html
          test -s assets/industry/console.css
          test -s assets/omnichat/index.html
          node --check assets/sovereign/site.js
          node --check assets/sovereign/workspace.js
          node --check assets/sovereign/omnichat.js
          test -s assets/omnichat/index.html
          test -s assets/sovereign/site.css
          test -s assets/sovereign/workspace.css
          test -s assets/sovereign/hero.webp
          test ! -e assets/labs/index.html
          grep -Fq 'osmanx-core-five-live-v1' assets/sovereign/site.js

      - name: Validate cinematic media before publishing
        run: |
          set -euo pipefail
          test -s assets/stories/cinema.html
          test -s assets/stories/cinema.css
          test -s assets/stories/cinema.js
          test -s assets/stories/media/00-osmanx-film.mp4
          node --check assets/stories/cinema.js
          node --check assets/stories/cinema-r2.js
          node --check assets/stories/cinema-r3.js
          node --check assets/stories/manager.js
          test -s assets/stories/cinema-r3.css
          test -s assets/stories/manager.html
          test -s assets/stories/manager.css
          test -s assets/stories/privacy.html
          node --check assets/stories/story-engine.js
          test -s assets/stories/cinema-r2.css
          test -s assets/stories/captions-ru.vtt
          test -s robots.txt
          test -s sitemap.xml
          node --test tests/stories-gallery.test.mjs tests/cinema-media.test.mjs tests/cinema-r2.test.mjs tests/cinema-r3.test.mjs tests/cinema-r4.test.mjs tests/cinema-r5.test.mjs

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/osmanx_deploy
          chmod 600 ~/.ssh/osmanx_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Validate target and sync static site
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test "$DEPLOY_USER" = "deploy-osmanx"
          ssh -i ~/.ssh/osmanx_deploy -o IdentitiesOnly=yes -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" 'test -d /var/www/osmanx.world && test -w /var/www/osmanx.world'
          rsync -az --delete --chmod=D2755,F0644             -e "ssh -i ~/.ssh/osmanx_deploy -o IdentitiesOnly=yes -o BatchMode=yes"             --exclude='/assets/downloads/***' --include='/index.html' --include='/robots.txt' --include='/sitemap.xml' --include='/assets/***' --include='/assets/downloads/source/***' --exclude='*'             ./ "$DEPLOY_USER@$DEPLOY_HOST:/var/www/osmanx.world/"
          ssh -i ~/.ssh/osmanx_deploy -o IdentitiesOnly=yes -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" 'test -s /var/www/osmanx.world/index.html'

      - name: Verify deployed file integrity on VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          expected="$(sha256sum index.html | cut -d ' ' -f1)"
          actual="$(ssh -i ~/.ssh/osmanx_deploy -o IdentitiesOnly=yes -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" 'sha256sum /var/www/osmanx.world/index.html' | cut -d ' ' -f1)"
          test "$expected" = "$actual"
          echo "VPS index.html SHA-256 matches the checked-out commit." >> "$GITHUB_STEP_SUMMARY"
          for asset in assets/guest/offer.html assets/guest/experiment.html assets/guest/experiment.js assets/guest/experiment-model.js assets/guest/pilot.html assets/guest/pilot.js assets/guest/pilot-model.js assets/guest/console.html assets/guest/console.js assets/guest/join.html assets/guest/join.js; do
            expected="$(sha256sum "$asset" | cut -d ' ' -f1)"
            actual="$(ssh -i ~/.ssh/osmanx_deploy -o IdentitiesOnly=yes -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "sha256sum /var/www/osmanx.world/$asset" | cut -d ' ' -f1)"
            test "$expected" = "$actual" || { echo "::error::VPS file mismatch: $asset"; exit 1; }
            echo "VPS SHA-256 matches repository: $asset" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Verify public HTTPS content
        env:
          EXPECTED_MARKER: "osmanx-sovereign-live-v1"
        run: |
          set -euo pipefail
          response="$(curl -fLsS --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 8 --max-time 35 -H 'Cache-Control: no-cache' "https://osmanx.world/?__deploy_verify=${GITHUB_SHA}")"
          if [[ "$response" != *"$EXPECTED_MARKER"* ]]; then
            echo "::error::Public HTTPS did not return the new deployment marker"
            exit 1
          fi
          echo "Public HTTPS served the expected deployment marker." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify OSMANX CINEMA public HTTPS release
        run: |
          set -euo pipefail
          for asset in assets/stories/cinema.html assets/stories/cinema.css assets/stories/cinema.js assets/stories/cinema-r2.js assets/stories/cinema-r3.js assets/stories/manager.html assets/stories/manager.js assets/stories/privacy.html assets/stories/story-engine.js assets/stories/cinema-r2.css assets/stories/captions-ru.vtt assets/stories/slides/scene-1.webp assets/stories/media/00-osmanx-film.mp4 robots.txt sitemap.xml; do
            curl -fIsSL --retry 3 --retry-delay 2 --connect-timeout 8 --max-time 40 "https://osmanx.world/$asset?release=$GITHUB_SHA" > /dev/null
          done
          for asset in assets/stories/media/*.mp4; do
            curl -fIsSL --retry 3 --retry-delay 2 --connect-timeout 8 --max-time 40 "https://osmanx.world/$asset?release=$GITHUB_SHA" > /dev/null
          done
          curl -fsSL --connect-timeout 8 --max-time 35 "https://osmanx.world/assets/stories/cinema.html?release=$GITHUB_SHA" -o /tmp/osmanx-cinema-live.html
          grep -Fq 'osmanx-cinema-experience-r1' /tmp/osmanx-cinema-live.html
          grep -Fq 'cinema-r2.js' /tmp/osmanx-cinema-live.html
          grep -Fq 'cinema-r3.js' /tmp/osmanx-cinema-live.html
          # Use versioned public URLs; a CDN may legally serve earlier unversioned assets.
          curl -fLsS --retry 3 --retry-delay 2 --connect-timeout 8 --max-time 35 -H 'Cache-Control: no-cache' "https://osmanx.world/assets/stories/manager.html?release=$GITHUB_SHA" -o /tmp/osmanx-r4-manager.html
          grep -Fq 'r4-followup-window' /tmp/osmanx-r4-manager.html || { echo "::error::R4 manager marker missing on public HTTPS"; exit 1; }
          grep -Fq 'r5-subject-form' /tmp/osmanx-r4-manager.html || { echo "::error::R5 subject-rights form missing on public HTTPS"; exit 1; }
          curl -fLsS --retry 3 --retry-delay 2 --connect-timeout 8 --max-time 35 -H 'Cache-Control: no-cache' "https://osmanx.world/assets/stories/manager.js?release=$GITHUB_SHA" -o /tmp/osmanx-r5-manager.js
          grep -Fq 'r5Online' /tmp/osmanx-r5-manager.js || { echo "::error::R5 manager JS missing on public HTTPS"; exit 1; }
          curl -fLsS --retry 3 --retry-delay 2 --connect-timeout 8 --max-time 35 -H 'Cache-Control: no-cache' "https://osmanx.world/assets/stories/cinema-r3.js?release=$GITHUB_SHA" -o /tmp/osmanx-r4-campaign.js
          grep -Fq 'utm_campaign' /tmp/osmanx-r4-campaign.js || { echo "::error::R4 campaign attribution code missing on public HTTPS"; exit 1; }
          echo 'Cinema page and all 13 MP4 files available on public HTTPS.' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Guest Intelligence public HTTPS release and CDN transformations
        run: |
          set -euo pipefail
          for asset in assets/guest/offer.html assets/guest/experiment.html assets/guest/experiment.js assets/guest/experiment-model.js assets/guest/pilot.html assets/guest/pilot.js assets/guest/pilot-model.js assets/guest/console.html assets/guest/console.js assets/guest/join.html assets/guest/join.js; do
            case "$asset" in
              assets/guest/offer.html) marker="Перейти в лабораторию" ;;
              assets/guest/experiment.html) marker="Паспорт и воспроизводимость" ;;
              assets/guest/experiment.js) marker="Сценарий импортирован и заново проверен" ;;
              assets/guest/experiment-model.js) marker="osmanx.guest.experiment.v1" ;;
              assets/guest/pilot.html) marker="PILOT OPERATIONS R3" ;;
              assets/guest/pilot.js) marker="Сценарий восстановлен после строгой проверки полей" ;;
              assets/guest/pilot-model.js) marker="osmanx.guest.pilot.v1" ;;
              assets/guest/console.html) marker="Guest Intelligence / R13 / Защищённый кабинет" ;;
              assets/guest/console.js) marker="Нет соединения с Industry API" ;;
              assets/guest/join.html) marker="Приглашение сотрудника" ;;
              assets/guest/join.js) marker="/staff/invitations/accept" ;;
            esac
            expected="$(sha256sum "$asset" | cut -d ' ' -f1)"
            observed=false
            for attempt in 1 2 3 4 5 6; do
              if curl -fsSL --retry 2 --connect-timeout 8 --max-time 30 \
                -H 'Cache-Control: no-cache' \
                "https://osmanx.world/$asset?release=$GITHUB_SHA" \
                -o /tmp/osmanx-guest-verify; then
                if LC_ALL=C grep -Fq "$marker" /tmp/osmanx-guest-verify; then
                  observed=true
                  break
                fi
              fi
              sleep 3
            done
            if test "$observed" != true; then
              echo "::error::Public HTTPS does not serve expected Guest content: $asset"
              exit 1
            fi
            actual="$(sha256sum /tmp/osmanx-guest-verify | cut -d ' ' -f1)"
            if test "$expected" = "$actual"; then
              echo "Public HTTPS SHA-256 exact: $asset" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::Public content bytes differ despite expected Guest marker; VPS SHA-256 was verified. Check edge transformations/cache for $asset"
              echo "Public Guest marker verified; bytes transformed upstream: $asset" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Verify live OSMANX workspaces over HTTPS
        run: |
          set -euo pipefail
          for asset in /assets/sovereign/site.css /assets/sovereign/site.js /assets/sovereign/workspace.html /assets/sovereign/workspace.css /assets/sovereign/workspace.js /assets/sovereign/hero.webp; do
            curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 8 --max-time 35 -o /dev/null "https://osmanx.world${asset}?release=${GITHUB_SHA}"
          done
          curl -fsSL --retry 3 --connect-timeout 8 --max-time 35 "https://osmanx.world/assets/sovereign/workspace.html?app=retail&release=${GITHUB_SHA}" -o /tmp/osmanx-workspace-live.html
          grep -Fq 'OSMANX — Рабочее пространство' /tmp/osmanx-workspace-live.html
          curl -fsSL --retry 3 --connect-timeout 8 --max-time 35 "https://osmanx.world/assets/omnichat/index.html?release=${GITHUB_SHA}" -o /tmp/osmanx-omnichat-live.html
          grep -Fq 'osmanx-omnichat-r36-source-live-v1' /tmp/osmanx-omnichat-live.html
          curl -fsSL --retry 3 --connect-timeout 8 --max-time 35 -o /dev/null "https://osmanx.world/assets/sovereign/omnichat.js?release=${GITHUB_SHA}"
          for asset in /assets/industry/index.html /assets/industry/style.css /assets/industry/app.js /assets/industry/console.html /assets/industry/console.css /assets/industry/console.js /assets/industry/operations.css /assets/industry/operations.js /assets/industry/booking.html /assets/industry/booking.css /assets/industry/booking.js; do
            curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 8 --max-time 35 -o /dev/null "https://osmanx.world${asset}?release=${GITHUB_SHA}"
          done
          curl -fsSL --retry 3 --connect-timeout 8 --max-time 35 "https://osmanx.world/assets/industry/app.js?release=${GITHUB_SHA}" -o /tmp/osmanx-industry-live.js
          grep -Fq "osmanx-industry-os-r2" /tmp/osmanx-industry-live.js
          echo "Sovereign workspaces and static assets served over public HTTPS." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify only five platform scope reached VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/osmanx_deploy -o IdentitiesOnly=yes -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" 'test ! -e /var/www/osmanx.world/assets/labs/index.html && test ! -e /var/www/osmanx.world/assets/labs/breakthrough/index.html && test ! -e /var/www/osmanx.world/assets/sovereign/cafe.webp && test ! -e /var/www/osmanx.world/assets/sovereign/nebula.webp'
          curl -fLsS --retry 3 --retry-all-errors --retry-delay 2 --max-time 35 "https://osmanx.world/assets/sovereign/site.js?scope=${GITHUB_SHA}" -o /tmp/osmanx-core-five.js
          grep -Fq 'osmanx-core-five-live-v1' /tmp/osmanx-core-five.js
          echo 'Core Five public JS verified; unrelated lab files removed from VPS.' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify live OmniChat full-source page
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 8 --max-time 35 "https://osmanx.world/assets/omnichat/index.html?release=${GITHUB_SHA}" -o /tmp/omnichat-source.html
          grep -Fq 'osmanx-omnichat-r36-source-live-v1' /tmp/omnichat-source.html
          echo "OmniChat full-source landing page published over HTTPS." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary key
        if: always()
        run: rm -f ~/.ssh/osmanx_deploy ~/.ssh/known_hosts
