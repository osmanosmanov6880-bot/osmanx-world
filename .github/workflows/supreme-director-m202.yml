name: OSGARD SUPREME DIRECTOR M202 Monitoring
on:
  push:
    branches: [ "recovery/supreme-director-m187-20261104" ]
    paths:
      - "supreme-director/m202/**"
      - ".github/workflows/supreme-director-m202.yml"
  pull_request:
    paths:
      - "supreme-director/m202/**"
      - ".github/workflows/supreme-director-m202.yml"
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.11', '3.13' ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Configure packages
        run: |
          echo "PYTHONPATH=$GITHUB_WORKSPACE/supreme-director/m192:$GITHUB_WORKSPACE/supreme-director/m193:$GITHUB_WORKSPACE/supreme-director/m194:$GITHUB_WORKSPACE/supreme-director/m195:$GITHUB_WORKSPACE/supreme-director/m196:$GITHUB_WORKSPACE/supreme-director/m197:$GITHUB_WORKSPACE/supreme-director/m198:$GITHUB_WORKSPACE/supreme-director/m199:$GITHUB_WORKSPACE/supreme-director/m200:$GITHUB_WORKSPACE/supreme-director/m201:$GITHUB_WORKSPACE/supreme-director/m202" >> "$GITHUB_ENV"
      - name: Check Python and JS
        run: |
          python3 -m compileall -q supreme-director/m202
          node --check supreme-director/m202/osgard_m202/web/app.js
      - name: M202 unit and HTTP tests
        run: python3 -m unittest discover -s supreme-director/m202/tests -p 'test_*.py' -v
      - name: Regression M192 through M201
        run: |
          for v in 192 193 194 195 196 197 198 199 200 201; do
            echo "=== Checking M$v ==="
            python3 -m unittest discover -s "supreme-director/m$v/tests" -p 'test_*.py' -v
          done
      - name: Offline end to end monitoring smoke
        run: python3 supreme-director/m202/smoke.py
