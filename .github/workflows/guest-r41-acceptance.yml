  r41-release-graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: services/industry-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: R41 exact Git tree, current main and ten-patch reviewer handoff GET-only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/r41-first-pr-gate.mjs --github > "$RUNNER_TEMP/r41-gate.json"
          node --input-type=module -e "import fs from 'node:fs';import {renderR41ReviewerGuide} from './src/guest-r41-review-gate.mjs';const a=JSON.parse(fs.readFileSync(process.argv[1]));if(a.schema!=='osmanx.guest.r41.github-get-only-review.v1'||a.treeProof?.valid!==true||a.treeProof?.verifiedFiles!==10||a.gate?.technicallyAuditable!==true||a.gate?.automaticMergeAllowed!==false||a.gate?.productionAuthorized!==false||a.githubWriteCalls!==0)process.exit(1);fs.writeFileSync(process.argv[2],renderR41ReviewerGuide(a.gate));console.log('R41 exact source verified, independent human approval and merge remain blocked.')" "$RUNNER_TEMP/r41-gate.json" "$RUNNER_TEMP/r41-reviewer-guide.md"
      - name: Publish independent human reviewer packet
        uses: actions/upload-artifact@v4
        with:
          name: guest-r41-pr47-review-guide
          path: ${{ runner.temp }}/r41-reviewer-guide.md
          if-no-files-found: error
          retention-days: 7
