          test -s ../../docs/GUEST_INTELLIGENCE_R37.md
          test -s ../../docs/GUEST_INTELLIGENCE_R38.md
          test -s ../../docs/GUEST_INTELLIGENCE_R39.md
          test -s ../../docs/GUEST_INTELLIGENCE_R40.md
          test -s ../../docs/GUEST_INTELLIGENCE_R41.md
