name: OSMANX Labs browser acceptance
on:
  push:
    branches: [main]
    paths:
      - "assets/labs/**"
      - "assets/sovereign/site.js"
      - "tests/labs_browser_smoke.py"
      - ".github/workflows/labs-browser.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser tooling
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run real browser acceptance
        run: python tests/labs_browser_smoke.py
      - name: Attach screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osmanx-labs-browser-qa
          path: qa/labs/*.png
          if-no-files-found: ignore
