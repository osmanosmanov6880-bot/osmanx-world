name: Industry R4 encrypted backup and isolated restore
on:
  pull_request:
    branches: [main]
    paths:
      - "services/industry-api/ops/**"
      - "services/industry-api/Dockerfile"
      - "services/industry-api/compose.yml"
      - "services/industry-api/migrations/**"
      - ".github/workflows/industry-dr-ci.yml"
  push:
    branches: [main]
    paths:
      - "services/industry-api/ops/**"
      - "services/industry-api/Dockerfile"
      - "services/industry-api/compose.yml"
      - "services/industry-api/migrations/**"
      - ".github/workflows/industry-dr-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  encrypted-backup-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: industry_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d industry_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: services/industry-api
    env:
      MIGRATION_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/industry_ci
      BACKUP_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/industry_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PostgreSQL and age encryption tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client age
      - name: Verify shell and Compose file syntax
        run: |
          sh -n ops/provision-roles.sh
          sh -n ops/backup-encrypted.sh
          sh -n ops/restore-dr.sh
          sh -n ops/runtime-check.sh
          # Keep environment placeholder-only, no credential material in repo.
          test -f ops/.env.example
      - name: Verify Guest runtime source parity
        run: |
          cmp shared/experiment-model.js ../../assets/guest/experiment-model.js
          cmp shared/pilot-model.js ../../assets/guest/pilot-model.js
          node --check shared/experiment-model.js
          node --check shared/pilot-model.js
      - name: Install migration runtime
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test operator SQL provisioning idempotence
        run: |
          export PGHOST=127.0.0.1 PGUSER=postgres PGDATABASE=industry_ci PGPASSWORD=postgres
          export INDUSTRY_APP_PASSWORD=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          export INDUSTRY_WORKER_PASSWORD=cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          sh ops/provision-roles.sh
          sh ops/provision-roles.sh
      - name: Migrate and seed synthetic sample
        run: |
          npm run migrate
          PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d industry_ci -c "INSERT INTO industry.tenants(slug,name,vertical) VALUES('ci-dr-seed','Synthetic DR Dataset','lab');"
          PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d industry_ci -c "INSERT INTO industry.services(tenant_id,name,duration_minutes,price_minor) SELECT id,'DR synthetic service',30,9900 FROM industry.tenants WHERE slug='ci-dr-seed';"
      - name: Encrypt backup to two independent age recipients
        run: |
          set -euo pipefail
          age-keygen -o "$RUNNER_TEMP/key1.txt"
          age-keygen -o "$RUNNER_TEMP/key2.txt"
          pub1="$(grep '^# public key:' "$RUNNER_TEMP/key1.txt" | awk '{print $4}')"
          pub2="$(grep '^# public key:' "$RUNNER_TEMP/key2.txt" | awk '{print $4}')"
          test -n "$pub1" && test -n "$pub2" && test "$pub1" != "$pub2"
          AGE_RECIPIENT_1="$pub1" AGE_RECIPIENT_2="$pub2" sh ops/backup-encrypted.sh "$RUNNER_TEMP/backups"
          test "$(find "$RUNNER_TEMP/backups" -name '*.age' | wc -l)" -eq 1
          test "$(find "$RUNNER_TEMP/backups" -name '*.sha256' | wc -l)" -eq 1
      - name: Restore with both independent identities
        run: |
          set -euo pipefail
          archive="$(find "$RUNNER_TEMP/backups" -name '*.age' -print -quit)"
          PGPASSWORD=postgres createdb -h 127.0.0.1 -U postgres industry_dr_first_key
          PGPASSWORD=postgres createdb -h 127.0.0.1 -U postgres industry_dr_second_key
          DR_RESTORE_DB_URL=postgresql://postgres:postgres@127.0.0.1:5432/industry_dr_first_key AGE_IDENTITY_FILE="$RUNNER_TEMP/key1.txt" sh ops/restore-dr.sh "$archive"
          DR_RESTORE_DB_URL=postgresql://postgres:postgres@127.0.0.1:5432/industry_dr_second_key AGE_IDENTITY_FILE="$RUNNER_TEMP/key2.txt" sh ops/restore-dr.sh "$archive"
          for database in industry_dr_first_key industry_dr_second_key; do
            count="$(PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d "$database" -Atc "SELECT count(*) FROM industry.services WHERE name='DR synthetic service'")"
            test "$count" -eq 1
          done
      - name: Refuse production target and corrupted archives
        run: |
          set -euo pipefail
          archive="$(find "$RUNNER_TEMP/backups" -name '*.age' -print -quit)"
          if DR_RESTORE_DB_URL=postgresql://postgres:postgres@127.0.0.1:5432/industry_ci AGE_IDENTITY_FILE="$RUNNER_TEMP/key1.txt" sh ops/restore-dr.sh "$archive"; then
            echo "::error::Production-like database target was not rejected"; exit 1
          fi
          mkdir "$RUNNER_TEMP/tampered"
          cp "$archive" "$RUNNER_TEMP/tampered/"
          cp "$archive.sha256" "$RUNNER_TEMP/tampered/"
          printf 'corruption' >> "$RUNNER_TEMP/tampered/$(basename "$archive")"
          if DR_RESTORE_DB_URL=postgresql://postgres:postgres@127.0.0.1:5432/industry_ci AGE_IDENTITY_FILE="$RUNNER_TEMP/key1.txt" sh ops/restore-dr.sh "$RUNNER_TEMP/tampered/$(basename "$archive")"; then
            echo "::error::Corrupt archive was not rejected"; exit 1
          fi
      - name: Validate operator Compose file
        run: |
          command -v docker
          export POSTGRES_ADMIN_PASSWORD=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          export INDUSTRY_APP_PASSWORD=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          export INDUSTRY_WORKER_PASSWORD=cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          export WEBHOOK_HMAC_KEY=dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
          export WEBHOOK_URL=https://example.com/events
          export BOOTSTRAP_EMAIL=owner@example.com
          export BOOTSTRAP_PASSWORD=some-strong-placeholder-password
          export BOOTSTRAP_TENANT_SLUG=example-tenant
          export BOOTSTRAP_TENANT_NAME=Example
          export BOOTSTRAP_VERTICAL=dental
          docker compose --file compose.yml --profile setup --profile integrations config --quiet
          docker build --tag osmanx-industry-api:ci .
          test "$(docker run --rm --entrypoint id osmanx-industry-api:ci -u)" -eq 1000
          # The R4 image built but couldn't resolve ../../../assets/guest;
          # this smoke imports real modules INSIDE the isolated production image.
          docker run --rm --entrypoint node osmanx-industry-api:ci --input-type=module -e \
            "await import('./src/guest.mjs'); const {evaluate}=await import('./shared/pilot-model.js'); console.log('R5 Guest container runtime: loaded')"
          docker build --file ops/Dockerfile.backup --tag osmanx-industry-maintenance:ci .
          test "$(docker run --rm --entrypoint id osmanx-industry-maintenance:ci -u)" -ne 0
