name: OSGARD SUPREME DIRECTOR M205 Cost Reconciliation and Net ROI
on:
  push:
    branches: [ "recovery/supreme-director-m187-20261104" ]
    paths:
      - "supreme-director/m205/**"
      - ".github/workflows/supreme-director-m205.yml"
  pull_request:
    paths:
      - "supreme-director/m205/**"
      - ".github/workflows/supreme-director-m205.yml"
permissions:
  contents: read
jobs:
  cost-control:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.11', '3.13' ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Configure Python M192-M205 imports
        run: |
          echo "PYTHONPATH=$GITHUB_WORKSPACE/supreme-director/m192:$GITHUB_WORKSPACE/supreme-director/m193:$GITHUB_WORKSPACE/supreme-director/m194:$GITHUB_WORKSPACE/supreme-director/m195:$GITHUB_WORKSPACE/supreme-director/m196:$GITHUB_WORKSPACE/supreme-director/m197:$GITHUB_WORKSPACE/supreme-director/m198:$GITHUB_WORKSPACE/supreme-director/m199:$GITHUB_WORKSPACE/supreme-director/m200:$GITHUB_WORKSPACE/supreme-director/m201:$GITHUB_WORKSPACE/supreme-director/m202:$GITHUB_WORKSPACE/supreme-director/m203:$GITHUB_WORKSPACE/supreme-director/m204:$GITHUB_WORKSPACE/supreme-director/m205" >> "$GITHUB_ENV"
      - name: Compile Python and syntax-check JS
        run: |
          python3 -m compileall -q supreme-director/m205
          node --check supreme-director/m205/osgard_m205/web/app.js
      - name: M205 unit, security and HTTP regression
        run: python3 -m unittest discover -s supreme-director/m205/tests -p 'test_*.py' -v
      - name: All previous M192-M204 regression
        run: |
          for v in 192 193 194 195 196 197 198 199 200 201 202 203 204; do
            echo "=== Regression M$v ==="
            python3 -m unittest discover -s "supreme-director/m$v/tests" -p 'test_*.py' -v
          done
      - name: M205 synthetic end-to-end source and recurring scenario
        run: python3 supreme-director/m205/smoke.py
