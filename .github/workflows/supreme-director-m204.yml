name: OSGARD SUPREME DIRECTOR M204 Economics and Priorities
on:
  push:
    branches: [ "recovery/supreme-director-m187-20261104" ]
    paths:
      - "supreme-director/m204/**"
      - ".github/workflows/supreme-director-m204.yml"
  pull_request:
    paths:
      - "supreme-director/m204/**"
      - ".github/workflows/supreme-director-m204.yml"
permissions:
  contents: read
jobs:
  economics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.11', '3.13' ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Configure local M192-M204 Python imports
        run: |
          echo "PYTHONPATH=$GITHUB_WORKSPACE/supreme-director/m192:$GITHUB_WORKSPACE/supreme-director/m193:$GITHUB_WORKSPACE/supreme-director/m194:$GITHUB_WORKSPACE/supreme-director/m195:$GITHUB_WORKSPACE/supreme-director/m196:$GITHUB_WORKSPACE/supreme-director/m197:$GITHUB_WORKSPACE/supreme-director/m198:$GITHUB_WORKSPACE/supreme-director/m199:$GITHUB_WORKSPACE/supreme-director/m200:$GITHUB_WORKSPACE/supreme-director/m201:$GITHUB_WORKSPACE/supreme-director/m202:$GITHUB_WORKSPACE/supreme-director/m203:$GITHUB_WORKSPACE/supreme-director/m204" >> "$GITHUB_ENV"
      - name: Compile Python and syntax check browser JavaScript
        run: |
          python3 -m compileall -q supreme-director/m204
          node --check supreme-director/m204/osgard_m204/web/app.js
      - name: M204 unit, security and HTTP
        run: python3 -m unittest discover -s supreme-director/m204/tests -p 'test_*.py' -v
      - name: Regression M192 through M203
        run: |
          for v in 192 193 194 195 196 197 198 199 200 201 202 203; do
            echo "=== Checking M$v ==="
            python3 -m unittest discover -s "supreme-director/m$v/tests" -p 'test_*.py' -v
          done
      - name: Synthetic end-to-end economic decision scenario
        run: python3 supreme-director/m204/smoke.py
